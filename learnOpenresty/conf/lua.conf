server {
        listen       81;
        server_name  _;

        location /lua {
            default_type 'text/html';
            content_by_lua 'ngx.say("hello lua")';
        }

        location ~ /req/(\d+)/(\d+){
            default_type "text/html;charset=utf-8";
            set $firstParam $1;
            set $secondParam $2;
            set $ip $host;
            lua_code_cache off;
            content_by_lua_file E:\git\learn\learnOpenresty\src\hello.lua;
            echo_after_body 'ngx.var.ip $ip';
        }

        location /test-response {
            default_type 'text/html;charset=utf-8';
            lua_code_cache off;
            # 以下路径出现转义情况
            content_by_lua_file E:\git\learn\learnOpenresty\src\/response.lua;
        }
}