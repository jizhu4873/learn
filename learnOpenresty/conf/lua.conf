server {
        listen       node1:80;
        #server_name  _;

        location /lua {
            default_type 'text/html';
            content_by_lua_file my-lua/hello.lua;
        }

        location ~ /req/(\d+)/(\d+){
            default_type "text/html";
            set $firstParam $1;
            set $secondParam $2;
            set $ip $host;
            content_by_lua_file my-lua/hello.lua;
            echo_after_body 'ngx.var.ip $ip';
        }
}