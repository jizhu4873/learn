<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>template</title>
  <link rel="stylesheet" href="css/bootstrap-3.3.7.css">
</head>
<style>
  [v-cloak]{
    display: none;
  }
</style>
<body>
<div id="app">
  <div class="panel panel-primary">
    <div class="panel-heading">
      <h3 class="panel-title">添加品牌</h3>
    </div>
      <div class="form-group">
        <label for="" class="col-sm-1 control-label">id</label>
        <div class="col-sm-2">
          <input type="text" class="form-control" placeholder="" v-model="id">
        </div>

          <label for="" class="col-sm-1 control-label">name</label>
          <div class="col-sm-5">
            <input type="text" class="form-control" placeholder="" v-model="name">
          </div>

          <button type="button" class="btn btn-primary" @click="add">add</button>

      </div>

  </div>
  <table class="table table-bordered table-hover table-striped">
    <thead>
      <tr>
        <th>id</th>
        <th>name</th>
        <th>creatTime</th>
        <th>op</th>
      </tr>
    </thead>
    <tbody>
      <tr v-for="o in list" :key="o.id">
        <td>{{o.id}}</td>
        <td>{{o.name}}</td>
        <td>{{o.creatTime}}</td>
        <td><a href="">删除</a></td>
      </tr>
    </tbody>
  </table>
</div>

<script src="js/vue.min.js"></script>
<script>
  var vm = new Vue({
    el:"#app",
    data:{
      id:"",
      name:"",
      list:[
        {id:1,name:"大奔",creatTime:new Date()},
        {id:2,name:"宝马",creatTime:new Date()},
      ]
    },
    methods:{
      add(){
        var car = {id:this.id,name:this.name,creatTime:new Date()}
        this.list.push(car)
        this.name=this.id=""
      }
    }
  });

</script>
</body>
</html>
