<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>无标题文档</title>
    <script language="javascript" src="js/LodopFuncs.js"></script>
    <script language="javascript" src="js/jquery-3.4.1.js"></script>
    <script language="javascript" src="js/vue-2.4.0.js"></script>
    <link rel="stylesheet" href="css/bootstrap-3.3.7.css">
    <style id="stl">
        #content div{
            border: 1px solid rgba(255, 153, 123, 0.45);
            width: 500px;
            height: 450px;
            margin-left: 100px;
            margin-top: 100px;
            position: relative;
        }

        span{
            position: absolute;
            background-color: #ffcab8;
        }
    </style>

    <style>
        span:hover{
            cursor: move;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="content" @mouseup="end">
        <div>
            <span v-for="(item,idx) in list" :id="'content'+idx"
                @mousedown="down(idx)"  @mousemove.capture="move(idx)"  @mouseup="end">
                {{item.val}}
            </span>
        </div>
    </div>
    <a @click.prevent="preview()" class="btn btn-default">预览</a>
</div>

<script language="javascript" type="text/javascript">
    var LODOP; //声明为全局变量

    var vm = new Vue({
        el:"#app",
        data:{
            list:[
                {val:25,left:100,top:10},
                {val:152,left:80,top:100}
                ],
            flags:false,
            position:{x:0,y:0},
            nx: '', ny: '', dx: '', dy: '', xPum: '', yPum: '',
        },
        methods:{
            preview(){
                var html = "<style>"+$("#stl").html()+"</style>"
                html = html+ "<div>"+$("#content").html()+"</div>";
                LODOP=getLodop();
                LODOP.PRINT_INIT("打印测试");
                LODOP.SET_PRINT_STYLE("FontSize",18);
                LODOP.SET_PRINT_STYLE("Bold",1);
                LODOP.ADD_PRINT_HTM(100,100,350,600,html);
                LODOP.PREVIEW();
            },
            down(idx){
                var cnt = document.getElementById("content"+idx);
                this.flags = true;
                this.position.x = event.clientX;
                this.position.y = event.clientY;
                this.dx = cnt.offsetLeft;
                this.dy = cnt.offsetTop;
            },
            move(idx){
                if(this.flags){
                    var cnt = document.getElementById("content"+idx);
                    let width = $("#content div").width();
                    let height = $("#content div").height();
                    this.nx = event.clientX - this.position.x;
                    this.ny = event.clientY - this.position.y;
                    this.xPum = this.dx+this.nx;
                    this.yPum = this.dy+this.ny;
                    if(this.xPum<0){
                        this.xPum = - this.xPum;
                    }
                    if(this.xPum > width){
                        this.xPum = width-20;
                    }
                    if(this.yPum<0){
                        this.yPum = - this.yPum;
                    }
                    if(this.yPum > height){
                        this.yPum = height-20;
                    }
                    cnt.style.left = this.xPum+"px";
                    cnt.style.top = this.yPum +"px";
                }
            },
            end(){
                this.flags = false;
            }
        },
        mounted(){
            this.list.forEach((e,idx)=>{
                var cnt = document.getElementById("content"+idx);
                cnt.style.left = e.left+"px";
                cnt.style.top = e.top+"px";
            })
        }
    });
</script>
</body>
</html>
